<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read on TV · Leitura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..32,400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24..48,500,0..1,0&display=block">
<style>
/* Canvas de TV 1920×1080 escalado para a janela. Duas colunas-pai empilhadas:
   1) .hero  → marca + título (+ imagem de fundo)
   2) .body  → texto, progresso, tempo restante e barra de ações */
:root {
  color-scheme: dark;
  --bg: #0d0e11;
  --panel: #16181e;
  --fg: #e9ecf2;          /* branco levemente acinzentado: evita halação em telas escuras */
  --muted: #9aa1b1;
  --accent: #8AB4F8;
  --accent-ink: #0b1430;
  --focus-bg: #f3f5fa;
  --focus-fg: #0d0e11;
  --hl: rgba(138, 180, 248,.17);
  --line: rgba(233,236,242,.14);
  --font: "Roboto", "Segoe UI", system-ui, sans-serif;
  --safe-x: 96px;          /* 5% de 1920 */
  --safe-y: 54px;          /* 5% de 1080 */
  --ease: cubic-bezier(.2,.7,.2,1);
}
html, body { height: 100%; }
body { margin: 0; background: #050507; color: var(--fg); overflow: hidden; font-family: var(--font); }
.ms {
  font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal;
  line-height: 1; white-space: nowrap; font-feature-settings: "liga"; -webkit-font-smoothing: antialiased;
  font-variation-settings: "FILL" 1, "wght" 500, "opsz" 40; display: inline-block;
}

/* Roboto Flex (fonte variável) só onde o navegador entende eixos variáveis (Chromium 62+, Safari 11+).
   TVs antigas ignoram este bloco e seguem com a Roboto estática; a woff2 da Flex só é baixada por quem entra aqui.
   opsz fixo e baixo: a 3 m, mesmo 34 px são lidos como texto pequeno, e o tamanho óptico "auto" escolheria
   o desenho de título (traço fino, espaçamento justo). Ícones (.ms) ficam de fora e mantêm os próprios eixos. */
@supports (font-variation-settings: normal) {
  :root {
    --font: "Roboto Flex", "Roboto", "Segoe UI", system-ui, sans-serif;
    --flex-opsz: 14;
  }
  body, body :not(.ms) { font-variation-settings: 'opsz' var(--flex-opsz); }
}

.stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  transform: translate(-50%, -50%) scale(var(--s, .5));
  background: var(--bg); overflow: hidden;
}
.app { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* ---------- Coluna 1: hero (marca + título) ---------- */
.hero { position: relative; flex: none; display: flex; flex-direction: column; padding: var(--safe-y) var(--safe-x) 0; }
.hero > :not(.hero-img) { position: relative; }
.hero-img {
  position: absolute; top: 0; right: 0; bottom: 0; width: 980px; transition: opacity .3s ease;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 20%), linear-gradient(#000 82%, transparent);
  -webkit-mask-composite: source-in;
          mask-image: linear-gradient(90deg, transparent, #000 20%), linear-gradient(#000 82%, transparent);
          mask-composite: intersect;
}
.hero-img img, .hero-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-img img { opacity: 1; }
.brand { display: flex; align-items: center; height: 64px; }
/* Marca igual à da home (index.html): símbolo + .logo, em 1080p (1rem = 16px) */
.brand .logo-mark { flex: none; display: block; width: 46px; height: 46px; margin-right: 16px; }
.logo {
  margin: 0;
  font-family: var(--font);
  font-weight: 700;
  font-size: 36px;
  color: #FFFFFF;
  font-variant-numeric: lining-nums;
  white-space: nowrap;
}
.title { margin: 44px 0 0; max-width: 1000px; font: 800 54px/1.16 var(--font); color: var(--accent); }
.hero-div, .hero-thumb { display: none; }

/* Hero recolhido: vira uma linha fina — marca | título | miniatura */
.collapsed .hero { flex-direction: row; align-items: center; gap: 28px; }
.collapsed .brand { height: 84px; }
.collapsed .brand .logo { display: none; }     /* recolhido: só o símbolo */
.collapsed .brand .logo-mark { margin-right: 0; }
.collapsed .hero-img { opacity: 0; }
.collapsed .hero-div { display: block; flex: none; width: 3px; height: 50px; border-radius: 2px; background: var(--line); }
.collapsed .title {
  flex: 1; min-width: 0; margin: 0; max-width: none; font-size: 34px; line-height: 1.1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Miniatura encostada no topo e na lateral direita da tela, com fade para a esquerda e para baixo */
.collapsed .title { margin-right: 220px; }
.collapsed .hero-thumb {
  display: block; position: absolute; top: 0; right: 0; bottom: 0; width: 380px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%), linear-gradient(#000 80%, transparent);
  -webkit-mask-composite: source-in;
          mask-image: linear-gradient(90deg, transparent, #000 25%), linear-gradient(#000 80%, transparent);
          mask-composite: intersect;
}

/* ---------- Coluna 2: leitura + ações ---------- */
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 var(--safe-x) var(--safe-y); }
.reader-wrap { flex: 1; min-height: 0; display: flex; gap: 28px; margin-top: 40px; }
/* Sem transição na altura: a troca do hero é compensada na rolagem no mesmo quadro (ver onProgress),
   então o texto que está na tela não se mexe; uma animação aqui faria o texto deslizar */
.collapsed .reader-wrap { margin-top: 30px; }

.reader {
  /* padding/margem à esquerda: folga para o anel de foco do "Ler novamente" (dentro do texto) não ser cortado */
  position: relative; flex: 0 0 1280px; box-sizing: border-box; overflow: hidden; padding: 6px 28px 0 20px; margin-left: -20px;
  --mask: linear-gradient(#000 calc(100% - 150px), transparent);
  -webkit-mask-image: var(--mask); mask-image: var(--mask);
}
.reader.scrolled { --mask: linear-gradient(transparent, #000 80px, #000 calc(100% - 150px), transparent); }
.reader.scrolled.at-end { --mask: linear-gradient(transparent, #000 80px); }
.reader.at-end:not(.scrolled) { --mask: none; }
/* Com "Ler novamente" à mostra, a base fica sem degradê: o botão pode encostar na barra de ações sem rolar o texto */
.reader.scrolled.rereading { --mask: linear-gradient(transparent, #000 80px); }
.prose { max-width: 1220px; font-size: var(--read-size); line-height: 1.5; }
.prose p { margin: 0 0 .85em; font-weight: 500; }
.prose h2 { margin: 1.2em 0 .45em; font: 700 1.04em/1.25 var(--font); color: var(--accent); text-wrap: balance; }
.s { border-radius: 8px; padding: 0 .08em; transition: background-color .25s, color .25s; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.s.cur { background: var(--hl); color: #fff; box-shadow: 0 0 0 .08em var(--hl); }

/* Barra de rolagem = barra de progresso */
.track { flex: none; width: 10px; margin: 4px 0; border-radius: 6px; background: var(--line); position: relative; }
.track .fill { position: absolute; inset: 0 0 auto; min-height: 10px; border-radius: 6px; background: var(--accent); transition: height .3s var(--ease); }

/* Tempo restante, ao lado do topo da barra */
.side { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.stats { flex: none; margin-top: -4px; font-size: 32px; font-weight: 500; line-height: 1.25; color: #b7bcc8; text-wrap: balance; }
.stats strong { color: var(--accent); font-weight: 700; }

/* Dica das primeiras aberturas: ↑ ↓ rolam o texto (some quando a pessoa usa as setas) */
.hint { margin-top: 36px; font-size: 30px; font-weight: 500; line-height: 1.3; color: var(--fg); text-wrap: balance; animation: fade .3s var(--ease); transition: opacity .3s ease; }
.hint.out { opacity: 0; }
.hint .keys { display: flex; margin-bottom: 14px; }
.hint .key {
  display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; margin-right: 12px;
  border: 2px solid rgba(233,236,242,.32); border-radius: 14px; background: rgba(233,236,242,.06);
}
.hint .key .ms { font-size: 44px; }

/* Fim do texto: marca fixa depois do último parágrafo; ↓ no fim faz a marca "quicar" */
.end-mark { position: relative; margin-top: 1.4em; padding-top: .8em; border-top: 2px solid var(--line); line-height: 1.35; color: var(--muted); }
/* "Fim da matéria" sempre em destaque: azul e um pouco maior que o texto corrido */
.end-mark strong { display: block; color: var(--accent); font-size: 1.1em; line-height: 1.25; font-weight: 700; }
/* "Ler novamente" fora do div.end-mark, logo abaixo dele; aparece com ↓ depois do fim e some com ↑ */
.reread { display: flex; align-items: center; margin-top: 20px; transition: opacity .25s ease; }
.reread .tvbtn { flex: none; }
/* Lembrete ao lado do botão: onde vão entrar os cards de notícias recomendadas */
.reread-note { flex: 1; min-width: 0; margin-left: 36px; font: 500 26px/1.3 ui-monospace, "Roboto Mono", Menlo, Consolas, monospace; color: var(--muted); }
.reread.closing { opacity: 0; }
/* Lembrete dos cards de notícias recomendadas: uma linha de texto */
.recs { margin: 1.2em 0 0; font: 500 30px/1.3 ui-monospace, "Roboto Mono", Menlo, Consolas, monospace; color: var(--muted); }
.reread + .recs { margin-top: 56px; }   /* folga para a sombra do botão focado */
.end-mark.bump { animation: end-bump .5s var(--ease); }
.end-mark.bump strong { animation: end-flash 1s ease; }
@keyframes end-bump { 30% { transform: translateY(-14px); } }
@keyframes end-flash { 0%, 45% { color: #fff; } }

/* Só para leitores de tela */
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.dock { flex: none; padding-top: 24px; }
.actions .slot { flex: none; width: 84px; height: 84px; }   /* lugar do Topo quando ele some: os outros botões não andam */
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 28px; }   /* folga para o anel de foco não encostar no vizinho */

/* ---------- Botões de TV ---------- */
.tvbtn {
  all: unset; box-sizing: border-box; cursor: pointer;
  display: inline-flex; align-items: center; gap: 14px;
  height: 84px; padding: 0 34px 0 28px; border-radius: 44px;
  font: 700 36px/1 var(--font); color: var(--fg);
  background: rgba(233,236,242,.1); border: 3px solid transparent;
  transition: transform .18s var(--ease), background-color .18s, color .18s, box-shadow .18s;
}
.tvbtn .ms { font-size: 44px; }
.tvbtn .sub { font-weight: 500; opacity: .75; }
.tvbtn.primary { background: var(--accent); color: var(--accent-ink); }
.tvbtn.icon { width: 84px; padding: 0; justify-content: center; }
.tvbtn.back { margin-right: 32px; }   /* Voltar afastado dos demais */
.tvbtn.end { margin-left: auto; }     /* "Ver imagens" alinhado à direita */
.tvbtn.focused {
  background: var(--focus-bg); color: var(--focus-fg); transform: scale(1.05);
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 7px var(--focus-bg), 0 18px 40px rgba(0,0,0,.55);
}
.tvbtn.primary.focused { background: #fff; }

/* ---------- Modal, toast e guias ---------- */
.scrim { position: absolute; inset: 0; background: rgba(5,5,7,.78); display: grid; place-items: center; animation: fade .2s var(--ease); }
.dialog { width: 940px; box-sizing: border-box; padding: 56px 60px; background: var(--panel); border: 1px solid var(--line); border-radius: 32px; }
.dialog h3 { margin: 0; font: 700 52px/1.2 var(--font); }
.dialog p { margin: 18px 0 40px; font-size: 38px; line-height: 1.45; color: var(--muted); }
.dialog .row { display: flex; gap: 22px; }
.toast {
  position: absolute; left: 50%; bottom: 190px; transform: translateX(-50%); max-width: 1400px;
  display: flex; gap: 16px; align-items: center; padding: 24px 38px; border-radius: 24px;
  background: var(--focus-bg); color: var(--focus-fg); font-size: 34px; font-weight: 700;
  box-shadow: 0 20px 50px rgba(0,0,0,.5); animation: fade .2s var(--ease);
}
.toast .ms { font-size: 42px; }
@keyframes fade { from { opacity: 0 } }

.guides { position: absolute; inset: 0; pointer-events: none; }
.guides::before { content: ""; position: absolute; inset: var(--safe-y) var(--safe-x); border: 2px dashed rgba(255,214,102,.85); }
.guides span { position: absolute; left: var(--safe-x); top: 12px; font-size: 26px; color: #ffd666; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
(function () {
  /* ---------- Escala do canvas 1920×1080 ---------- */
  const stage = document.getElementById('stage');
  const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080));
  fit(); addEventListener('resize', fit);

  const { useState, useEffect, useLayoutEffect, useRef } = React;
  const html = htm.bind(React.createElement);
  const { init, useFocusable, FocusContext, setFocus, getCurrentFocusKey, doesFocusableExist } = SpatialNav;
  init({ throttle: 90, throttleKeypresses: true });

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Conteúdo ---------- */
  /* A notícia vem de stories.js (a mesma base da tela inicial), escolhida por ?id=N */
  const STORIES = window.ROT_STORIES || [], IMGS = window.ROT_IMG || {};
  const POST_ID = Number(new URLSearchParams(location.search).get('id')) || (STORIES[0] && STORIES[0].id) || 0;
  const STORY = STORIES.find(s => s.id === POST_ID) || STORIES[0] || { id: 0, title: 'Notícia não encontrada', body: ['Esta notícia não está mais disponível.'] };
  const HERO_IMG = IMGS[STORY.id] || '';
  const TITLE = STORY.title;
  const BLOCKS = STORY.body.map(p => ['p', p]);
  document.title = TITLE + ' · Read on TV';
  /* Aberto dentro da tela inicial (iframe): Sair e tela cheia são tratados pela página-mãe */
  const PARENT = (() => { try { return window.parent !== window && window.parent.document ? window.parent : null; } catch (e) { return null; } })();
  const FS_DOC = PARENT ? PARENT.document : document;

  // Frases (para leitura em voz alta e destaque) e palavras restantes a partir de cada frase
  const SENTENCES = [];
  const DOC = BLOCKS.map(([type, text]) => ({
    type, ids: (type === 'h' ? [text] : text.replace(/([.!?])\s+/g, '$1\u0001').split('\u0001')).map(t => SENTENCES.push(t) - 1)
  }));
  const WPM = 180;
  const WORDS_FROM = new Array(SENTENCES.length + 1).fill(0);
  for (let i = SENTENCES.length - 1; i >= 0; i--) WORDS_FROM[i] = WORDS_FROM[i + 1] + SENTENCES[i].split(/\s+/).length;

  const SIZES = [{ label: 'Médio', px: 46 }, { label: 'Grande', px: 50 }, { label: 'Extra', px: 54 }];
  const RATES = [0.9, 1, 1.15, 1.3];
  const STORE = 'readontv:post-' + STORY.id;
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } };
  const save = (v) => { try { localStorage.setItem(STORE, JSON.stringify({ ...load(), ...v })); } catch (e) {} };
  // Dica "↑ ↓ rolam o texto": vale para todas as notícias. Some de vez quando a pessoa rola pelas setas
  // ou depois de aparecer HINT_MAX vezes sem uso.
  const HINT_KEY = 'readontv:hint-scroll', HINT_MAX = 3;
  const loadHint = () => { try { return JSON.parse(localStorage.getItem(HINT_KEY)) || {}; } catch (e) { return {}; } };
  const saveHint = (v) => { try { localStorage.setItem(HINT_KEY, JSON.stringify({ ...loadHint(), ...v })); } catch (e) {} };

  /* ---------- Rolagem do texto pelas setas (como a rolagem nativa do navegador) ----------
     Toque em ↑/↓: rola um pouco, com uma animação curta. Segurando: depois de HOLD_DELAY, rola contínuo
     em velocidade de leitura, com arranque suave, e para com desaceleração curta ao soltar.
     Um único laço de requestAnimationFrame só escreve scrollTop: não lê layout a cada quadro e não
     depende de scrollTo({ behavior }), que TVs antigas não têm. Medidas em linhas do texto, então o
     passo e a velocidade acompanham o tamanho da fonte. */
  const SCROLL = {
    TAP_LINES: 1.5,             // quanto um toque rola, em linhas
    HOLD_DELAY: 280,            // ms segurando até começar a rolagem contínua
    SPEED_LINES: 6,             // velocidade da rolagem contínua, em linhas por segundo
    RAMP: 300,                  // ms até chegar à velocidade máxima
    EASE: REDUCE ? 0 : 60,      // suavização em ms (0 = sem animação, para "reduzir movimento")
    STALE: 450                  // sem repetição da tecla nem keyup por este tempo = solta (controle que perde o keyup)
  };

  // onEdge(dir): a seta pediu para ir além do limite (toque no limite, ou rolagem segurada que chegou nele)
  function createScroller(getEl, getLine, onEdge) {
    let pos = 0, target = 0, hold = null, raf = 0, last = 0;
    const max = () => { const e = getEl(); return Math.max(0, e.scrollHeight - e.clientHeight); };
    const sync = () => { if (!raf) pos = target = getEl().scrollTop; };   // parado: parte de onde o texto está
    const frame = (now) => {
      const dt = clamp(now - last, 0, 64); last = now;   // limita dt: um quadro atrasado não vira salto
      const m = max();
      if (hold) {
        if (hold.repeated && now - hold.seen > SCROLL.STALE) hold = null;
        else {
          const t = now - hold.start - SCROLL.HOLD_DELAY;
          if (t > 0) {
            const speed = getLine() * SCROLL.SPEED_LINES / 1000 * Math.min(1, t / SCROLL.RAMP);
            target = clamp(target + hold.dir * speed * dt, 0, m);
            if (!hold.edged && (hold.dir > 0 ? target >= m : target <= 0)) { hold.edged = true; onEdge(hold.dir); }
          }
        }
      }
      pos += (target - pos) * (SCROLL.EASE ? 1 - Math.exp(-dt / SCROLL.EASE) : 1);
      if (!hold && Math.abs(target - pos) < 0.5) pos = target;
      getEl().scrollTop = pos;
      raf = hold || pos !== target ? requestAnimationFrame(frame) : 0;
    };
    const run = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };

      const onFs = () => setIsFs(!!FS_DOC.fullscreenElement);
      FS_DOC.addEventListener('fullscreenchange', onFs);
      return () => FS_DOC.removeEventListener('fullscreenchange', onFs);
    }, []);

    // Voltar (Backspace / Esc / teclas de controle), teclas de mídia e guias (G)
    useEffect(() => {
      const onKey = (e) => {
        if (e.key === 'Backspace' || e.key === 'Escape' || e.key === 'BrowserBack' || e.keyCode === 461 || e.keyCode === 10009) {
          e.preventDefault();
          if (modal) return closeModal();
          const k = getCurrentFocusKey();
          return k !== 'BTN_LISTEN' && k !== 'BTN_BACK' ? setFocus('BTN_LISTEN') : openModal();
        }
        if (modal) return;
        if (['MediaPlayPause', 'MediaPlay', 'MediaPause'].includes(e.key)) { e.preventDefault(); listen(); }
        else if (e.key === 'MediaStop') { e.preventDefault(); stopAll(); }
        else if (e.key === 'MediaTrackNext' && active) step(1);
        else if (e.key === 'MediaTrackPrevious' && active) step(-1);
        else if (e.key === 'g' || e.key === 'G') setGuides(v => !v);
      };
      addEventListener('keydown', onKey);
      return () => removeEventListener('keydown', onKey);
    });

    // Barra de ações: um único conjunto; os botões do player (PL_*) só aparecem com áudio ativo
    const btn = (focusKey, icon, props) => html`<${TvButton} key=${focusKey} focusKey=${focusKey} icon=${icon} onArrow=${actionArrow} ...${props} />`;
    const sizeLabel = 'Tamanho do texto: ' + SIZES[sizeIdx].label;
    const buttons = [
      btn('BTN_BACK', 'arrow_back', { variant: 'icon back', ariaLabel: 'Voltar', onPress: openModal }),
      // Topo antes de "Ouvir texto": sempre só o ícone ("Ler novamente" fica no texto, abaixo do fim da matéria)
      // Escondido no início do texto e enquanto "Ler novamente" está à mostra; o lugar fica reservado
      showTop && reread !== true
        ? btn('BTN_TOP', 'arrow_upward', { variant: 'icon', ariaLabel: 'Voltar ao topo do texto', onPress: goTop })
        : html`<span key="TOP_SLOT" class="slot" aria-hidden="true"></span>`,
      active && btn('PL_PREV', 'skip_previous', { variant: 'icon', ariaLabel: 'Frase anterior', onPress: () => step(-1) }),
      active
        ? btn('BTN_LISTEN', playing ? 'pause' : 'play_arrow', { variant: 'icon primary', ariaLabel: playing ? 'Pausar leitura' : 'Continuar leitura', onPress: listen })
        : btn('BTN_LISTEN', 'headphones', { label: 'Ouvir texto', onPress: listen }),
      active && btn('PL_NEXT', 'skip_next', { variant: 'icon', ariaLabel: 'Próxima frase', onPress: () => step(1) }),
      active && btn('PL_RATE', 'speed', { label: speech.rate.toLocaleString('pt-BR') + '×', ariaLabel: 'Velocidade ' + speech.rate, onPress: cycleRate }),
      active && btn('PL_STOP', 'stop', { variant: 'icon', ariaLabel: 'Parar áudio', onPress: stopAll }),
      active
        ? btn('BTN_SIZE', 'format_size', { variant: 'icon', ariaLabel: sizeLabel, onPress: cycleSize })
        : btn('BTN_SIZE', 'format_size', { label: 'Texto', sub: SIZES[sizeIdx].label, ariaLabel: sizeLabel, onPress: cycleSize }),
      btn('BTN_FULLSCREEN', isFs ? 'fullscreen_exit' : 'fullscreen', { variant: 'icon', ariaLabel: isFs ? 'Sair da tela cheia' : 'Tela cheia', onPress: toggleFullscreen }),
      btn('BTN_IMAGES', 'image', { label: 'Ver imagens', variant: 'end' })
    ];

    return html`<div ref=${appEl} class=${'app' + (collapsed ? ' collapsed' : '')}>
      <header class="hero">
        <div class="hero-img" aria-hidden="true"><img alt="" src=${HERO_IMG} /></div>
        <div class="brand">
          <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true">
            <rect width="100" height="100" rx="18" fill="var(--accent)"></rect>
            <circle cx="31.46" cy="32.77" r="18.54" fill="var(--bg)"></circle>
          </svg>
          <p class="logo">Read on TV</p>
        </div>
        <span class="hero-div" aria-hidden="true"></span>
        <h1 class="title">${TITLE}</h1>
        <div class="hero-thumb" aria-hidden="true"><img alt="" src=${HERO_IMG} /></div>
      </header>

      <main class="body">
        <div class="reader-wrap">
          <${Reader} sizePx=${SIZES[sizeIdx].px} idx=${speech.idx} api=${reader} onProgress=${onProgress} userScrollAt=${userScrollAt}
            reread=${reread} onReread=${rereadPress} onRereadArrow=${rereadArrow} />
          <div class="track" aria-hidden="true"><span class="fill" style=${{ height: prog.pct * 100 + '%' }}></span></div>
          <div class="side">
            <${ReadingStats} done=${atEnd} from=${Math.max(prog.first, speech.idx)} />
            ${hint > 0 && html`<div class=${'hint' + (hint === 2 ? ' out' : '')} role="status">
              <span class="sr">Use as setas para cima e para baixo para rolar o texto</span>
              <div class="keys" aria-hidden="true">
                <span class="key"><span class="ms">keyboard_arrow_up</span></span>
                <span class="key"><span class="ms">keyboard_arrow_down</span></span>
              </div>
              <span aria-hidden="true">Use as setas para rolar o texto</span>
            </div>`}
          </div>
        </div>
        <div class="dock"><${Row} focusKey="ACTIONS" className="actions">${buttons}<//></div>
      </main>

      ${guides && html`<div class="guides" aria-hidden="true"><span>Área segura · 5%</span></div>`}
      ${modal && html`<${ExitDialog} onStay=${closeModal} onExit=${exit} />`}
      ${toast && html`<div class="toast" role="status"><span class="ms">${toast.icon}</span>${toast.text}</div>`}
    </div>`;
  }

  /* Controle pelo celular: a tela inicial recebe os comandos e repassa a tecla para este iframe */
  addEventListener('message', (e) => {
    const d = e.data;
    if (e.origin !== location.origin || !d || d.type !== 'rot-key') return;
    ['keydown', 'keyup'].forEach(type => {
      const ev = new KeyboardEvent(type, { key: d.key, code: d.code || d.key, bubbles: true, cancelable: true });
      try { Object.defineProperty(ev, 'keyCode', { get: () => d.keyCode }); } catch (err) {}
      document.dispatchEvent(ev);
    });
  });

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</html>
