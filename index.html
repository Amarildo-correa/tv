<!doctype html>
<html lang="pt-BR">
<title>Read on TV</title>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  /* Navegadores de TV que entregam uma tela menor que 1080p (o Silk do Fire OS usa 960×540) desenham a página
     em baixa resolução e ampliam: fica pixelado. Fixar a largura em 1920 px faz o navegador desenhar em 1080p.
     O layout é todo proporcional à largura (rem = 100vw / 120), então a página fica idêntica, só mais nítida. */
  (function () {
    var tv = /Silk|AFT[A-Z]|SMART-TV|SmartTV|Tizen|Web0S|webOS|BRAVIA|Android TV|GoogleTV|CrKey|HbbTV|VIDAA/i;
    if (tv.test(navigator.userAgent) && screen.width < 1920) {
      document.getElementById('vp').setAttribute('content', 'width=1920, viewport-fit=cover');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&icon_names=air,arrow_back,bedtime,chevron_left,chevron_right,clear_day,clear_night,close_fullscreen,cloud,cloud_off,cloud_sync,foggy,gamepad,humidity_percentage,local_library,location_city,mouse,open_in_full,partly_cloudy_day,partly_cloudy_night,rainy,rainy_heavy,rainy_light,sports_soccer,theater_comedy,thermostat,thunderstorm,trending_up,umbrella,water_drop,wb_twilight,weather_snowy&display=block">
<style>
/* Layout: tela de TV 1920×1080 em rem (1rem = 16px em 1080p), margem de segurança de 5%, header sem fundo,
   destaque em duas colunas (notícia + previsão do tempo) e rails que deslizam na vertical */
:root {
  --bg: #121212;
  --surface: #141414;
  --surface-focus: #2A2A2A;
  --surface-card-focus: #1E1E1E;
  --surface-hover: #11223A; /* azul-marinho do hover: contraste 7,1:1 com o azul de destaque e 16:1 com o branco */
  --text-title: #FFFFFF;
  --text-body: #EDEDED;
  --text-meta: #B8B8B8;
  --accent: #66B2FF;
  --focus: #FFFFFF;
  --on-focus: #000000;
  --placeholder: #1F2C38;

  /* Roboto: a família de interface do YouTube (a YouTube Sans é proprietária e não é distribuída).
     Uma família só, com dois pesos: 700 nos títulos e 500 no texto (mais firme que o 400 a 3 m de distância). */
  --font-title: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --size-headline: 3.5rem;
  --size-card-title: 2.25rem; /* 36 px em 1080p */
  --size-body: 2.125rem;      /* 34 px em 1080p: texto corrido da leitura */
  --size-meta: 1.5rem;

  --gutter: 9rem;
  --card-pad: .625rem;
  --card-gap: 2rem;
  /* 2 cards inteiros na largura útil; o que sobra no gutter vira o peek de cada lado */
  --card-w: calc((120rem - 2 * var(--gutter) - var(--card-gap)) / 2);
  /* Altura: a área de conteúdo mostra 1 linha de rail inteira + metade da próxima (peek embaixo).
     Área = tela − padding do topo (2.5) − header (4.5) − espaço até o conteúdo (1.5) */
  --vp-h: calc(100vh - 8.5rem);
  --row-gap: 2.5rem;  /* espaço entre linhas */
  --head-h: 2.5rem;   /* título da linha (2rem × 1.25) */
  --head-gap: 1rem;   /* título → cards */
  --row-h: calc((var(--vp-h) - var(--row-gap)) / 1.5);
  --card-h: calc(var(--row-h) - var(--head-h) - var(--head-gap));
  /* Texto abaixo da imagem: tag (1.5 × 1.25) + .375 + título em 2 linhas (2.25 × 1.25 × 2) + .5
     + resumo em 3 linhas (2 × 1.3 × 3) + .625 + data (1.5 × 1.25) */
  --size-excerpt: 2rem; /* 32 px em 1080p: quase o tamanho do título (36 px) */
  --card-txt: 18.675rem;
  /* A tag começa sobre a parte da imagem que já sumiu no degradê */
  --card-overlap: 1.5rem;

  --ring: 4px;
  --dur: 180ms;
  --slide: 320ms cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}

html { font-size: calc(100vw / 120); height: 100%; }
/* Barra de rolagem nativa com trilho transparente (página no modo cursor e telas de leitura/previsão).
   scrollbar-color vale nos navegadores novos; ::-webkit-scrollbar cobre os Chromium antigos das TVs. */
html { scrollbar-color: rgba(255, 255, 255, .3) transparent; }
::-webkit-scrollbar { width: 12px; height: 12px; background: transparent; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .3); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, .45); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background:
    radial-gradient(70rem 32rem at 100% 0%, rgba(102, 178, 255, .09), rgba(102, 178, 255, 0) 70%) no-repeat,
    var(--bg);
  color: var(--text-body);
  font-family: var(--font-body);
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
}
.ms {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  font-feature-settings: 'liga';
  user-select: none;
}
.ms.fill { font-variation-settings: 'FILL' 1; }
button { font: inherit; color: inherit; cursor: pointer; }

.app {
  height: 100%;
  padding-top: 2.5rem; padding-bottom: 0;
  padding-left: var(--gutter); padding-right: var(--gutter);
  display: flex;
  flex-direction: column;
}

/* Header (sem fundo) */
.top { position: relative; z-index: 3; display: flex; flex-wrap: nowrap; align-items: center; min-height: 4.5rem; min-width: 0; flex: 0 0 auto; }
.logo {
  margin: 0;
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 2.25rem;
  color: var(--text-title);
  font-variant-numeric: lining-nums;
  white-space: nowrap;
}
.sep { flex: 0 0 2px; height: 2.5rem; background: var(--surface-focus); }
.sep.accent { flex-basis: 3px; background: var(--accent); }
.nav { display: flex; align-items: center; }
.clock { margin-left: auto; display: flex; align-items: baseline; white-space: nowrap; }
.clock #date { font-size: var(--size-meta); color: var(--text-meta); }
.clock .hh { font-family: var(--font-title); font-weight: 700; font-size: 2.5rem; color: var(--text-title); font-variant-numeric: tabular-nums lining-nums; }
.weather { display: flex; align-items: center; white-space: nowrap; min-width: 0; }
.weather .ms { font-size: 2.75rem; color: var(--accent); }
.weather .temp { font-family: var(--font-title); font-weight: 700; font-size: 2.25rem; color: var(--text-title); font-variant-numeric: lining-nums; }
.weather .lbl { font-size: var(--size-meta); color: var(--text-meta); max-width: 14rem; overflow: hidden; text-overflow: ellipsis; }

.pill {
  -webkit-appearance: none; appearance: none;
  border: 0;
  height: 3.5rem;
  padding: 0 1rem;
  border-radius: 999px;
  display: inline-flex; align-items: center;
  font-size: var(--size-meta);
  line-height: 1;
  white-space: nowrap;
  background: transparent;
  color: var(--text-title);
  outline: none;
  transition: transform var(--dur) ease, background-color var(--dur) ease, color var(--dur) ease;
}
.pill[aria-current="true"] { background: var(--surface-focus); }
/* Tela cheia: botão só com ícone no fim da nav */
.pill.fs { width: 3.5rem; padding: 0; justify-content: center; color: var(--accent); }
.pill.fs .ms { font-size: 2rem; }
html:not(.pointer) .pill:focus { background: var(--focus); color: var(--on-focus); transform: scale(1.06); }

/* Área de linhas */
.viewport { flex: 1 1 auto; min-height: 0; position: relative; z-index: 1; overflow: hidden; margin-left: calc(-1 * var(--gutter)); margin-right: calc(-1 * var(--gutter)); padding-left: var(--gutter); padding-right: var(--gutter); }
.rows {
  position: relative;
  display: flex; flex-direction: column;
  padding-top: 1rem; padding-bottom: 3rem;
  transition: transform var(--slide);
}

/* Mídia */
.media { position: relative; overflow: hidden; border-radius: 1rem; background: var(--placeholder); max-width: 100%; }
.media .ph { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; color: var(--accent); }
.media .ph .ms { font-size: 4rem; }
.media img { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
/* Feedback de foco: só a imagem dá zoom, dentro da própria moldura; o card não muda de tamanho */
.card .media img, .feature .media img { transform: scale(1); }
/* A classe é posta pelo JS só quando o foco chega de outro elemento (não ao voltar para a aba/janela). */
.card.zoom-fx .media img, .feature.zoom-fx .media img { animation: focus-zoom 500ms cubic-bezier(.25, .1, .25, 1) 80ms both; }
@keyframes focus-zoom {
  from { transform: scale(1); }
  to   { transform: scale(1.35); }
}

/* CTA que aparece só com foco (expande sem deslocar o resto de forma brusca) */
.cta-wrap { display: grid; grid-template-rows: 0fr; opacity: 0; margin-top: -1rem; transition: opacity var(--dur) ease; }
.cta-wrap > div { min-height: 0; overflow: hidden; display: flex; padding: 4px; }
.cta {
  display: inline-flex; align-items: center; justify-content: center;
  height: 4rem; padding: 0 3rem; border-radius: 999px;
  background: var(--focus); color: var(--on-focus);
  font-size: 1.875rem; line-height: 1; white-space: nowrap;
}
html:not(.pointer) .wx:focus .cta-wrap { grid-template-rows: 1fr; opacity: 1; margin-top: 2rem; }

/* Destaque: duas colunas */
.hero { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); grid-gap: 2.5rem; gap: 2.5rem; height: 38rem; }

/* Notícia em destaque — sem foco: brilho azul na borda esquerda e no canto inferior esquerdo;
   com foco: fundo liso (--bg), anel branco afastado do card, sem divisória no kicker e CTA visível */
.feature {
  position: relative; height: 100%; min-width: 0;
  border-radius: 1rem;
  outline: .375rem solid transparent; outline-offset: .75rem;
  --fb: 18, 18, 18;
  transition: outline-color var(--dur) ease;
  cursor: pointer;
}
html:not(.pointer) .feature:focus { outline-color: var(--focus); }
.feature-clip {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit; overflow: hidden;
  background: rgb(var(--fb));
}
.feature-clip::before {
  content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(32% 7% at 0% 100%, rgba(102, 178, 255, .22) 0%, rgba(102, 178, 255, 0) 100%),
    linear-gradient(to right, rgba(102, 178, 255, .26) 0%, rgba(102, 178, 255, .09) 2.2%, rgba(102, 178, 255, 0) 5%);
  transition: opacity var(--dur) ease;
}
html:not(.pointer) .feature:focus .feature-clip::before { opacity: 0; }
.feature .media { position: absolute; top: 0; bottom: 0; right: 0; left: 42%; border-radius: 0; z-index: 1; }
.feature .media::after {
  content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(to right, rgba(var(--fb), 1) 0%, rgba(var(--fb), .96) 4%, rgba(var(--fb), .86) 8%, rgba(var(--fb), .7) 12%, rgba(var(--fb), .5) 16%, rgba(var(--fb), .31) 20%, rgba(var(--fb), .16) 24%, rgba(var(--fb), .06) 28%, rgba(var(--fb), 0) 32%);
}
.feature-text {
  position: relative; z-index: 2; height: 100%; width: calc(29rem + 7.5rem); max-width: 100%;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 3rem 3.75rem;
}
.kicker { display: flex; align-items: center; font-size: var(--size-meta); color: var(--accent); text-transform: uppercase; letter-spacing: .02em; }
.kicker .rule { width: 3px; height: 2.25rem; background: var(--accent); transition: opacity var(--dur) ease; }
html:not(.pointer) .feature:focus .kicker .rule { opacity: 0; }
.headline {
  margin: 0;
  font-family: var(--font-title); font-weight: 700;
  font-size: var(--size-headline); line-height: 1.15;
  color: var(--text-title);
  font-variant-numeric: lining-nums;
  text-wrap: balance;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.feature .headline { margin-top: 1rem; max-width: 25.75rem; font-size: 1.875rem; line-height: 1.33; text-wrap: wrap; }
.summary {
  margin: 2.25rem 0 0; max-width: 28.5rem;
  font-size: 1.4rem; line-height: 1.36; color: var(--text-body);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.feature .cta-wrap { margin: 0 0 0 calc(-1.375rem - 4px); }
html:not(.pointer) .feature:focus .cta-wrap { grid-template-rows: 1fr; opacity: 1; margin-top: 3.75rem; }
.feature .cta { height: 3.875rem; padding: 0 2.75rem 0 2.25rem; font-size: 1.625rem; }
.feature .cta .ms { font-size: 2.25rem; }

/* Previsão do tempo */
.wx {
  --wx-pad: 2rem;
  position: relative; height: 100%; min-width: 0;
  display: flex; flex-direction: column;
  padding: 1.75rem var(--wx-pad);
  border-radius: 1.5rem;
  background: transparent;
  outline: var(--ring) solid transparent; outline-offset: 0;
  transition: outline-color var(--dur) ease, background-color var(--dur) ease;
  cursor: pointer;
}
html:not(.pointer) .wx:focus { outline-color: var(--focus); }
.wx-head { display: flex; align-items: center; white-space: nowrap; min-width: 0; flex: 0 0 auto; }
.wx-title { font-family: var(--font-title); font-weight: 700; font-size: 2rem; color: var(--text-title); }
.wx-head .bar { flex: 0 0 3px; height: 2.25rem; background: var(--accent); }
.wx-head .city { font-size: 1.75rem; color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
.wx-strip {
  flex: 1 1 auto; min-height: 0;
  display: flex; overflow: hidden;
  margin-right: calc(-1 * (var(--wx-pad) + 4.5rem));
  /* Peek à direita some aos poucos (degradê suavizado até transparente, sem aresta) */
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 5.5rem), rgba(0, 0, 0, .95) calc(100% - 4.8rem), rgba(0, 0, 0, .82) calc(100% - 4.1rem), rgba(0, 0, 0, .62) calc(100% - 3.45rem), rgba(0, 0, 0, .4) calc(100% - 2.75rem), rgba(0, 0, 0, .2) calc(100% - 2.05rem), rgba(0, 0, 0, .07) calc(100% - 1.4rem), rgba(0, 0, 0, .01) calc(100% - .7rem), transparent 100%);
          mask-image: linear-gradient(to right, #000 calc(100% - 5.5rem), rgba(0, 0, 0, .95) calc(100% - 4.8rem), rgba(0, 0, 0, .82) calc(100% - 4.1rem), rgba(0, 0, 0, .62) calc(100% - 3.45rem), rgba(0, 0, 0, .4) calc(100% - 2.75rem), rgba(0, 0, 0, .2) calc(100% - 2.05rem), rgba(0, 0, 0, .07) calc(100% - 1.4rem), rgba(0, 0, 0, .01) calc(100% - .7rem), transparent 100%);
  transition: margin-right var(--slide);
}
html:not(.pointer) .wx:focus .wx-strip { margin-right: 0; -webkit-mask-image: none; mask-image: none; }
.wx .cta-wrap > div { justify-content: center; }

.day {
  /* largura do conteúdo da coluna da previsão: (102rem - 2.5rem) / 2.12 - 2 × padding */
  flex: 0 0 calc(((120rem - 2 * var(--gutter) - 2.5rem) / 2.12 - 2 * var(--wx-pad) - 3rem) / 3);
  height: 100%; min-height: 0;
  border-radius: 1.25rem;
  padding: 1.5rem 1rem;
  display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
  text-align: center;
  background: linear-gradient(180deg, #1f2a36 0%, #161b21 100%);
  overflow: hidden;
}
.day.today { background: linear-gradient(180deg, #2F4863 0%, #1F2C38 100%); }
.day .d { font-size: 1.875rem; color: var(--text-title); }
.day > .ms { font-size: 5rem; color: var(--text-body); }
.day.today > .ms { color: var(--text-title); }
.day .t { font-family: var(--font-title); font-weight: 700; font-size: 4.5rem; line-height: 1; color: var(--text-title); font-variant-numeric: lining-nums; }
.day .c {
  font-size: var(--size-meta); line-height: 1.2; color: var(--text-body);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.day .r { font-size: var(--size-meta); color: var(--text-meta); font-variant-numeric: tabular-nums; }
.day .r b { color: var(--text-title); font-weight: 700; }
.day.skel .d, .day.skel .t { color: var(--text-meta); }
.wx-msg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: var(--size-body); color: var(--text-meta); margin-right: calc(var(--wx-pad) + 4.5rem); }
html:not(.pointer) .wx:focus .wx-msg { margin-right: 0; }
.wx-msg .ms { font-size: 4rem; color: var(--accent); }

/* Rails (a .rail-wrap ocupa a largura total da tela; as setas dos peeks ficam fora da máscara do rail) */
.rail-wrap { position: relative; margin-left: calc(-1 * var(--gutter)); margin-right: calc(-1 * var(--gutter)); }
/* Escurece os peeks nas laterais (substitui o mask-image, que custava uma camada por rail) */
.rail-wrap::before, .rail-wrap::after {
  content: ''; position: absolute; top: -.75rem; bottom: -.75rem; z-index: 2; pointer-events: none;
  width: calc(var(--gutter) - .5rem);
}
.rail-wrap::before { left: 0; background: linear-gradient(to right, rgba(18, 18, 18, .7), rgba(18, 18, 18, 0)); }
.rail-wrap::after { right: 0; background: linear-gradient(to left, rgba(18, 18, 18, .7), rgba(18, 18, 18, 0)); }
.row { display: flex; flex-direction: column; min-width: 0; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; }
.row-head h2 { margin: 0; font-family: var(--font-title); font-weight: 700; font-size: 2rem; line-height: 1.25; color: var(--text-title); font-variant-numeric: lining-nums; }
.rail {
  position: relative;
  overflow: hidden;
  padding: .75rem var(--gutter); margin: -.75rem 0;
}
.frame {
  position: absolute; top: .75rem; left: var(--gutter); z-index: 0;
  width: var(--card-w); height: var(--card-h);
  border-radius: 1.25rem;
  outline: var(--ring) solid var(--focus); outline-offset: 0;
  opacity: 0;
  transition: opacity var(--dur) ease, transform var(--slide);
  pointer-events: none;
}
.rail.is-active .frame { opacity: 1; }
.track {
  position: relative; z-index: 1;
  display: flex;
  transition: transform var(--slide);
  will-change: transform;
}
.card {
  -webkit-appearance: none; appearance: none; border: 0; background: transparent; text-align: left;
  flex: 0 0 var(--card-w);
  height: var(--card-h);
  padding: var(--card-pad);
  border-radius: 1.25rem;
  /* Imagem em cima, título + data embaixo (como os cards do YouTube na TV) */
  display: flex; flex-direction: column;
  outline: none;
  transition: background-color var(--dur) ease;
}
.card .media {
  flex: 0 0 auto; width: 100%;
  height: calc(var(--card-h) - 2 * var(--card-pad) - var(--card-txt) + var(--card-overlap)); min-height: 8rem;
  border-radius: .75rem;
}
/* Degradê na base da imagem: a foto se dissolve na cor de fundo do card antes da tag
   (--fade acompanha o fundo: o da página no controle, o azul-marinho no hover do cursor) */
.card { --fade: 18, 18, 18; }
.card .media::after {
  content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom,
    rgba(var(--fade), 0) 40%, rgba(var(--fade), .08) 52%, rgba(var(--fade), .25) 64%,
    rgba(var(--fade), .5) 76%, rgba(var(--fade), .78) 88%, rgba(var(--fade), 1) 100%);
}
.card .txt { position: relative; z-index: 1; flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; margin-top: calc(-1 * var(--card-overlap)); padding: 0 .25rem; }
.card .tag { font-size: var(--size-meta); line-height: 1.25; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
.card .excerpt {
  margin: 0;
  font-size: var(--size-excerpt); line-height: 1.3; font-weight: 600; color: var(--text-title);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;
}
.card h3 {
  margin: 0;
  font-family: var(--font-title); font-weight: 700;
  font-size: var(--size-card-title); line-height: 1.25;
  color: var(--accent); /* título em azul: contraste 8,4:1 sobre o fundo */
  font-variant-numeric: lining-nums;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .time { margin-top: auto; font-size: var(--size-meta); line-height: 1.25; color: var(--text-meta); }

/* Telas sobrepostas (leitura e previsão completa) */
.overlay {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10;
  background: var(--bg);
  padding-top: 2.5rem; padding-bottom: 2.5rem; padding-left: var(--gutter); padding-right: var(--gutter);
  overflow-y: auto;
}
.back {

/* ===== Modo cursor (Silk / mouse / toque) =====
   O JS põe .pointer no <html> quando o ponteiro se mexe e tira ao usar as setas do controle.

.card h3, .headline, .wx-title { transition: color var(--dur) ease; text-decoration-thickness: .125rem; text-underline-offset: .3rem; }

.mode-sheet {

  pointer-events: none;
  opacity: 0; visibility: hidden;

}

}

/* Contagem até sumir: barra fina na base que encolhe (só transform) */
.mode-timer {
  position: absolute; left: 0; right: 0; bottom: 0; height: .3rem;
  background: var(--accent); opacity: .75;
  -webkit-transform-origin: left center; transform-origin: left center;
  -webkit-transform: scaleX(0); transform: scaleX(0);
}

  /* Rail: anel de foco fixo no 1º card; a fila desliza para o card focado ficar sempre nessa posição */
  function railStep(r) {
    return r.cards.length > 1 ? r.cards[1].offsetLeft - r.cards[0].offsetLeft : r.cards[0].offsetWidth + remPx(2);
  }
  function applyRail(r) {
    if (mode === 'pointer') { applyRailPointer(r); return; }
    r.track.style.transform = 'translateX(' + (-r.index * railStep(r)) + 'px)';
  }

  /* Linhas: todo rail focado sobe para o topo da área de conteúdo */
  function applyVertical(i) {
    if (mode === 'pointer') return;
    var r = rows[i];
    if (!r || r.type === 'nav') return;
    var y = r.type === 'rail' ? r.el.offsetTop : 0;
    /* Não sobe além do fim do conteúdo: as últimas linhas param encostadas na base, sem espaço vazio */
    y = Math.min(y, Math.max(0, rowsEl.offsetHeight - viewport.clientHeight));
    rowsEl.style.transform = 'translateY(' + (-y) + 'px)';
  }

  }

    if (r.type === 'nav') {
      markActiveRail(-1);
      navItems[navIndex].focus({ preventScroll: true });
      return;
    }
    lastContent = i;
    setActiveSection(r.section);
    markActiveRail(i);
    applyVertical(i);
    if (r.type === 'hero') r.items[r.index].focus({ preventScroll: true });
    else { applyRail(r); r.cards[r.index].focus({ preventScroll: true }); }
    navIndex = Math.max(0, navItems.findIndex(function (b) { return b.dataset.section === r.section; }));
  }

  function move(dir) {
    var r = rows[cur];
    if (dir === 'left' || dir === 'right') {
      var d = dir === 'right' ? 1 : -1;
      if (r.type === 'nav') {
        navIndex = Math.max(0, Math.min(navItems.length - 1, navIndex + d));
        navItems[navIndex].focus({ preventScroll: true });
      } else if (r.type === 'hero') {
        var h = Math.max(0, Math.min(r.items.length - 1, r.index + d));
        if (h !== r.index) { r.index = h; r.items[h].focus({ preventScroll: true }); }
      } else if (r.type === 'rail') {
        var next = Math.max(0, Math.min(r.cards.length - 1, r.index + d));
        if (next !== r.index) { r.index = next; applyRail(r); r.cards[next].focus({ preventScroll: true }); }
      }
      return;
    }
    if (dir === 'up') {
      if (cur > 0) focusRow(cur - 1);
    } else {
      if (r.type === 'nav') focusRow(lastContent);

  var lastZoom = null;

  var pushed = false;

    var media = document.getElementById('readerMedia');
    media.innerHTML = mediaHTML(s);
    guardImages(media);
    openOverlay(reader, e.currentTarget);
  }
  function openForecast(e) {
    renderForecast();
    openOverlay(forecast, e.currentTarget);
  }


  /* ===== Modo cursor ===== */
  var VISIBLE = 2; /* cards inteiros visíveis por rail */
  function maxOff(r) { return Math.max(0, r.cards.length - VISIBLE); }
  function applyRailPointer(r) {
    r.off = Math.max(0, Math.min(maxOff(r), r.off));
    r.track.style.transform = 'translateX(' + (-r.off * railStep(r)) + 'px)';
    r.prev.disabled = r.off === 0;
    r.next.disabled = r.off >= maxOff(r);
  }
  /* A seta do peek avança/volta uma página (2 cards) */
  function pageRail(r, d) {
    r.off += d * VISIBLE;
    applyRailPointer(r);
  }

  function noAnim(fn) {
    root.classList.add('no-anim');
    fn();
    void root.offsetWidth;
    requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove('no-anim'); }); });
  }

  /* Rolagem do documento que deixa a linha logo abaixo do cabeçalho (mesma posição do modo controle) */
  function scrollTargetFor(i) {
    var r = rows[i];
    if (!r || !r.el || r.type === 'hero') return 0;
    var top = r.el.getBoundingClientRect().top + window.scrollY;
    return Math.max(0, top - topEl.offsetHeight - remPx(1.5));
  }
  function scrollToRow(i, smooth) {
    window.scrollTo({ top: scrollTargetFor(i), behavior: smooth && !reduceMotion ? 'smooth' : 'auto' });
  }
  /* Linha de conteúdo que está no topo da área visível */
  function rowAtTop() {
    var limit = topEl.getBoundingClientRect().bottom + remPx(4);
    var best = 1;
    for (var i = 1; i < rows.length; i++) {
      if (rows[i].el.getBoundingClientRect().bottom > limit) { best = i; break; }
      best = i;
    }
    return best;
  }
  var scrollQueued = false;
  function updateFromScroll() {
    if (mode !== 'pointer' || overlay) return;
    topEl.classList.toggle('stuck', window.scrollY > 2);
    var i = rowAtTop();
    /* No fim da página a última seção não chega ao topo; marca a última */
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) i = rows.length - 1;
    lastContent = i;
    setActiveSection(rows[i].section);
  }
  window.addEventListener('scroll', function () {
    if (scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(function () { scrollQueued = false; updateFromScroll(); });
  }, { passive: true });

  /* Aviso de troca de modo */
  var sheet = document.getElementById('modeSheet');
  var sheetTimer = null;
  var booted = false;
  var MODE_COPY = {
    kbd: { icon: 'gamepad', title: 'Modo controle',
      desc: 'Use as <b>setas</b> para navegar e <b>OK</b> para abrir.' },
    pointer: { icon: 'mouse', title: 'Modo cursor',
      desc: 'Aponte para uma notícia e aperte <b>OK</b> para abrir.' }
  };
  function notifyMode(m) {
    if (!booted) return;
    var c = MODE_COPY[m];
    document.getElementById('modeIcon').textContent = c.icon;
    document.getElementById('modeTitle').textContent = c.title;
    document.getElementById('modeDesc').innerHTML = c.desc;
    /* Reinicia a entrada e a contagem mesmo se o aviso já estiver na tela */
    sheet.classList.remove('show');
    void sheet.offsetWidth;
    sheet.classList.add('show');
    clearTimeout(sheetTimer);
    sheetTimer = setTimeout(function () { sheet.classList.remove('show'); }, 4000);
  }
  function setMode(m, target) {
    var prev = mode;
    applyMode(m, target);
    if (mode !== prev) notifyMode(mode);
  }

  function applyMode(m, target) {
    if (m === mode) return;
    if (m === 'pointer') {
      var keep = cur === 0 ? lastContent : cur;
      var ovScroll = overlay ? overlay.scrollTop : 0;
      mode = 'pointer';
      if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
      if (lastZoom) { lastZoom.classList.remove('zoom-fx'); lastZoom = null; }
      markActiveRail(-1);
      noAnim(function () {
        root.classList.add('pointer');
        rowsEl.style.transform = '';
        rows.forEach(function (r) { if (r.type === 'rail') { r.off = r.index; applyRailPointer(r); } });
      });
      if (overlay) { savedScroll = null; window.scrollTo(0, ovScroll); }
      else { window.scrollTo(0, scrollTargetFor(keep)); updateFromScroll(); }
      return;
    }

    /* Volta ao controle: foca o item sob o cursor ou, se não houver, a linha que está no topo */
    var el = target || (hovered && hovered.matches(':hover') ? hovered : null);
    var top = overlay ? 0 : rowAtTop();
    var docScroll = window.scrollY;
    mode = 'kbd';
    topEl.classList.remove('stuck');
    noAnim(function () {
      root.classList.remove('pointer');
      window.scrollTo(0, 0);
      rows.forEach(function (r) {
        if (r.type !== 'rail') return;
        r.index = Math.min(r.cards.length - 1, r.off);
        applyRail(r);
      });
      if (overlay) return;
      var i = top, ni;
      if (el && (ni = navItems.indexOf(el)) !== -1) { navIndex = ni; i = 0; }
      else if (el) {
        for (var k = 1; k < rows.length; k++) {
          var r = rows[k];
          var idx = r.type === 'hero' ? r.items.indexOf(el) : r.cards.indexOf(el);
          if (idx !== -1) { r.index = idx; i = k; break; }
        }
      }
      if (i !== 0) applyVertical(i);
      focusRow(i);
    });
    if (overlay) { overlay.scrollTop = docScroll; overlay.querySelector('.back').focus({ preventScroll: true }); return; }
    var a = document.activeElement;
    if (a && a.matches && a.matches('.card, .feature') && a !== lastZoom) { playZoom(a); lastZoom = a; }
  }

  /* Sinais de cursor: movimento real do ponteiro (não os mousemove sintéticos de layout), clique/toque e roda */
  var lastX = null, lastY = null;
  document.addEventListener('mousemove', function (e) {
    if (lastX !== null && (Math.abs(e.clientX - lastX) > 2 || Math.abs(e.clientY - lastY) > 2)) setMode('pointer');
    lastX = e.clientX; lastY = e.clientY;
  }, { passive: true });
  document.addEventListener('pointerdown', function () { lastPointerDown = Date.now(); setMode('pointer'); }, true);
  document.addEventListener('touchstart', function () { lastPointerDown = Date.now(); setMode('pointer'); }, { passive: true, capture: true });
  document.addEventListener('wheel', function () { setMode('pointer'); }, { passive: true });
  /* No modo cursor o clique não deve deixar foco para trás (o OK do controle acionaria o item errado) */
  document.addEventListener('mousedown', function (e) {
    if (mode === 'pointer' && e.target.closest && e.target.closest('button, [role="button"]')) e.preventDefault();
  });
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest && e.target.closest('.card, .feature, .wx, .pill');
    if (t) hovered = t;
  });

  /* Teclas do controle */
  var BACK_KEYS = ['Escape', 'Backspace', 'BrowserBack', 'GoBack'];
  /* 4 = Voltar do controle do Fire TV quando a página roda num WebView */
  var BACK_CODES = [461, 10009, 8, 27, 4];
  var KEY_DIRS = { 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown' };
  document.addEventListener('keydown', function (e) {
    var map = { ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up' };
    var key = map[e.key] ? e.key : (KEY_DIRS[e.keyCode] || e.key);
    var isBack = BACK_KEYS.indexOf(e.key) !== -1 || BACK_CODES.indexOf(e.keyCode) !== -1;
    if (mode === 'pointer') {
      /* A primeira seta só devolve o foco visível; as próximas navegam */
      if (map[key]) { e.preventDefault(); setMode('kbd'); }
      else if (isBack && overlay) { e.preventDefault(); requestClose(); }
      return;
    }
    if (overlay) {
      if (isBack) { e.preventDefault(); requestClose(); }
      else if (key === 'ArrowDown' || key === 'ArrowUp') {
        e.preventDefault();
        overlay.scrollBy({ top: (key === 'ArrowDown' ? 1 : -1) * window.innerHeight * 0.3, behavior: reduceMotion ? 'auto' : 'smooth' });
      } else if (map[key]) e.preventDefault();
      return;
    }
    /* OK do controle nos blocos do destaque (não são <button>) */
    var t = document.activeElement;
    if ((e.key === 'Enter' || e.keyCode === 13) && t && t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON') {
      e.preventDefault(); t.click(); return;
    }
    if (map[key]) { e.preventDefault(); move(map[key]); return; }
    if (isBack && cur !== 0) { e.preventDefault(); focusRow(0); }
  });

  /* Data e hora */
  var TZ = 'America/Sao_Paulo';
  function tick() {
    var now = new Date();
    var p = {};
    new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })
      .formatToParts(now).forEach(function (x) { p[x.type] = x.value; });
    var wd = (p.weekday || '').replace('.', '');
    var mo = (p.month || '').replace('.', '');
    document.getElementById('date').textContent = cap(wd) + ', ' + p.day + ' ' + mo + '/' + p.year;
    document.getElementById('time').textContent =
      new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(now);
  }

  /* Previsão do tempo (Open-Meteo, gratuita e sem chave) */
  function wmo(code, isDay) {
    if (code === 0) return ['Céu limpo', isDay ? 'clear_day' : 'clear_night'];
    if (code === 1) return ['Poucas nuvens', isDay ? 'partly_cloudy_day' : 'partly_cloudy_night'];
    if (code === 2) return ['Parcialmente nublado', isDay ? 'partly_cloudy_day' : 'partly_cloudy_night'];
    if (code === 3) return ['Nublado', 'cloud'];
    if (code === 45 || code === 48) return ['Nevoeiro', 'foggy'];
    if (code >= 51 && code <= 57) return ['Garoa', 'rainy_light'];
    if (code >= 61 && code <= 67) return ['Chuva', 'rainy'];
    if (code >= 80 && code <= 82) return ['Pancadas de chuva', 'rainy_heavy'];
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ['Neve', 'weather_snowy'];
    if (code >= 95) return ['Tempestade', 'thunderstorm'];
    return ['Instável', 'partly_cloudy_day'];
  }
  function dayLabel(dateStr, i) {
    if (i === 0) return 'Hoje';
    var d = new Date(dateStr + 'T12:00:00Z');
    return cap(new Intl.DateTimeFormat('pt-BR', { weekday: 'short', timeZone: 'UTC' }).format(d).replace('.', ''));
  }
  function dayLong(dateStr, i) {
    if (i === 0) return 'Hoje';
    if (i === 1) return 'Amanhã';
    var d = new Date(dateStr + 'T12:00:00Z');
    return cap(new Intl.DateTimeFormat('pt-BR', { weekday: 'long', timeZone: 'UTC' }).format(d).split('-')[0]);
  }
  function deg(n) { return Math.round(n) + '°'; }

  function setHeaderWeather(icon, temp, label) {
    document.getElementById('weather').innerHTML =
      '<span class="ms" aria-hidden="true">' + icon + '</span>' +
      (temp !== null ? '<span class="temp">' + temp + '</span>' : '') +
      '<span class="lbl">' + esc(label) + '</span>';
  }

  function renderStrip() {
    var strip = document.getElementById('wxStrip');
    if (!strip) return;
    if (!WX) {
      if (wxError) {
        strip.innerHTML = '<div class="wx-msg"><span class="ms" aria-hidden="true">cloud_off</span>Previsão indisponível no momento</div>';
        return;
      }
      strip.innerHTML = ['Hoje', '—', '—', '—'].map(function (l, i) {
        return '<div class="day skel' + (i === 0 ? ' today' : '') + '"><span class="d">' + l + '</span>' +
          '<span class="ms" aria-hidden="true">cloud_sync</span><span class="t">--°</span><span class="c">Carregando</span><span class="r">&nbsp;</span></div>';
      }).join('');
      return;
    }
    var d = WX.daily, c = WX.current;
    strip.innerHTML = d.time.map(function (t, i) {
      var w = i === 0 ? wmo(c.weather_code, c.is_day === 1) : wmo(d.weather_code[i], true);
      var big = i === 0 ? c.temperature_2m : d.temperature_2m_max[i];
      return '<div class="day' + (i === 0 ? ' today' : '') + '">' +
        '<span class="d">' + dayLabel(t, i) + '</span>' +
        '<span class="ms fill" aria-hidden="true">' + w[1] + '</span>' +
        '<span class="t">' + deg(big) + '</span>' +
        '<span class="c">' + w[0] + '</span>' +
        '<span class="r"><b>' + deg(d.temperature_2m_max[i]) + '</b> / ' + deg(d.temperature_2m_min[i]) + '</span>' +
      '</div>';
    }).join('');
  }

  function renderForecast() {
    var body = document.getElementById('fcBody');
    var upd = document.getElementById('fcUpd');
    if (!WX) {
      upd.textContent = '';
      body.innerHTML = '<div class="fc-msg"><span class="ms" aria-hidden="true">' + (wxError ? 'cloud_off' : 'cloud_sync') + '</span>' +
        (wxError ? 'Não foi possível carregar a previsão agora. Tente de novo em alguns minutos.' : 'Carregando previsão…') + '</div>';
      return;
    }
    var c = WX.current, d = WX.daily, h = WX.hourly;
    var now = wmo(c.weather_code, c.is_day === 1);
    upd.textContent = 'Atualizado às ' + c.time.slice(11, 16);

    var key = c.time.slice(0, 13);
    var start = Math.max(0, h.time.findIndex(function (t) { return t.slice(0, 13) === key; }));
    var hours = '';
    for (var k = 0; k < 6; k++) {
      var j = start + k * 3;
      if (j >= h.time.length) break;
      var hw = wmo(h.weather_code[j], h.is_day[j] === 1);
      hours += '<div class="hour"><span class="h">' + (k === 0 ? 'Agora' : h.time[j].slice(11, 16)) + '</span>' +
        '<span class="ms fill" aria-hidden="true">' + hw[1] + '</span>' +
        '<span class="t">' + deg(h.temperature_2m[j]) + '</span>' +
        '<span class="p"><span class="ms fill" aria-hidden="true">water_drop</span>' + (h.precipitation_probability[j] || 0) + '%</span></div>';
    }

    var lo = Math.min.apply(null, d.temperature_2m_min), hi = Math.max.apply(null, d.temperature_2m_max);
    var span = Math.max(1, hi - lo);
    var week = d.time.map(function (t, i) {
      var w = wmo(d.weather_code[i], true);
      var left = (d.temperature_2m_min[i] - lo) / span * 100;
      var width = (d.temperature_2m_max[i] - d.temperature_2m_min[i]) / span * 100;
      return '<div class="wrow">' +
        '<span class="dd"><b>' + dayLong(t, i) + '</b><span>' + w[0] + '</span></span>' +
        '<span class="ms fill" aria-hidden="true">' + w[1] + '</span>' +
        '<span class="p"><span class="ms fill" aria-hidden="true">water_drop</span>' + (d.precipitation_probability_max[i] || 0) + '%</span>' +
        '<span class="mn">' + deg(d.temperature_2m_min[i]) + '</span>' +
        '<span class="range" aria-hidden="true"><i style="left:' + left.toFixed(1) + '%;width:' + Math.max(4, width).toFixed(1) + '%"></i></span>' +
        '<span class="mx">' + deg(d.temperature_2m_max[i]) + '</span>' +
      '</div>';
    }).join('');

    body.innerHTML =
      '<div class="fc-grid">' +
        '<section class="fc-now">' +
          '<div class="now-card">' +
            '<div class="now-main">' +
              '<span class="ms fill" aria-hidden="true">' + now[1] + '</span>' +
              '<span class="now-temp">' + deg(c.temperature_2m) + '</span>' +
              '<span class="now-desc"><strong>' + now[0] + '</strong><span>Máx ' + deg(d.temperature_2m_max[0]) + ' · Mín ' + deg(d.temperature_2m_min[0]) + '</span></span>' +
            '</div>' +
            '<div class="now-details">' +
              '<div class="det"><span class="k"><span class="ms" aria-hidden="true">thermostat</span>Sensação</span><span class="v">' + deg(c.apparent_temperature) + '</span></div>' +
              '<div class="det"><span class="k"><span class="ms" aria-hidden="true">humidity_percentage</span>Umidade</span><span class="v">' + Math.round(c.relative_humidity_2m) + '%</span></div>' +
              '<div class="det"><span class="k"><span class="ms" aria-hidden="true">air</span>Vento</span><span class="v">' + Math.round(c.wind_speed_10m) + ' km/h</span></div>' +
              '<div class="det"><span class="k"><span class="ms" aria-hidden="true">umbrella</span>Chuva hoje</span><span class="v">' + (d.precipitation_probability_max[0] || 0) + '%</span></div>' +
              '<div class="det"><span class="k"><span class="ms" aria-hidden="true">wb_twilight</span>Nascer do sol</span><span class="v">' + d.sunrise[0].slice(11, 16) + '</span></div>' +
              '<div class="det"><span class="k"><span class="ms" aria-hidden="true">bedtime</span>Pôr do sol</span><span class="v">' + d.sunset[0].slice(11, 16) + '</span></div>' +
            '</div>' +
          '</div>' +
          '<div><h3>Próximas horas</h3><div class="hours">' + hours + '</div></div>' +
        '</section>' +
        '<section><h3>Próximos 7 dias</h3><div class="week">' + week + '</div></section>' +
      '</div>';
  }

  function loadWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=-29.6783&longitude=-51.1306' +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day' +
      '&hourly=temperature_2m,weather_code,precipitation_probability,is_day' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset' +
      '&timezone=America%2FSao_Paulo&forecast_days=7';
    var ctl = 'AbortController' in window ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
    fetch(url, ctl ? { signal: ctl.signal } : {})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        clearTimeout(timer);
        WX = data; wxError = false;
        var w = wmo(data.current.weather_code, data.current.is_day === 1);
        setHeaderWeather(w[1], deg(data.current.temperature_2m), w[0]);
      })
      .catch(function () {
        clearTimeout(timer);
        if (!WX) { wxError = true; setHeaderWeather('cloud_off', null, 'Tempo indisponível'); }
      })
      .then(function () {
        renderStrip();
        if (overlay === forecast) renderForecast();
      });
  }

  /* Início */
  build();
  tick();
  setInterval(tick, 15000);
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
  window.addEventListener('resize', function () {
    rows.forEach(function (r) { if (r.type === 'rail') applyRail(r); });
    applyVertical(cur === 0 ? lastContent : cur);
  });
  rows.forEach(function (r) { if (r.type === 'rail') applyRailPointer(r); });
  focusRow(1);
  /* O Silk do Fire TV abre com o cursor virtual; mouse de desktop também começa no modo cursor */
  var startPointer = /Silk/i.test(navigator.userAgent) ||
    (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
  if (startPointer) setMode('pointer');
  booted = true;
  window.addEventListener('load', function () {
    if (mode === 'kbd' && !overlay && (!document.activeElement || document.activeElement === document.body)) focusRow(1);
  });
})();
</script>

</html>
