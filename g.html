<!doctype html>
<!--
  PROTÓTIPO DESCARTÁVEL — Controle remoto pelo celular via MQTT público
  A mesma página tem dois papéis:
    • TV (sem ?c=):        mostra código + QR, escuta comandos e exibe tudo em letra grande
    • Celular (?c=CÓDIGO): d-pad virtual que publica os comandos
  Usa um broker MQTT público (sem conta). Não é usada pelo resto do projeto.
  Para remover: apague este arquivo (g.html) e a linha marcada "TESTE-GAMEPAD" no index.html.
-->
<html lang="pt-BR">
<title>Read on TV · Controle pelo celular</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root { --bg: #121212; --fg: #FFFFFF; --muted: #B8B8B8; --accent: #66B2FF; --ok: #7BE495; --bad: #FF8A80; --warn: #FFD54F; --tile: #242424; color-scheme: dark; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  [hidden] { display: none !important; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }

  /* ---------- TV ---------- */
  .tv { padding: 3vh 4vw; height: 100vh; box-sizing: border-box; display: flex; gap: 4vw; overflow: hidden; }
  .tv .left { flex: 0 0 34%; display: flex; flex-direction: column; gap: 1.6vh; }
  .tv h1 { margin: 0; font-size: 4vh; color: var(--accent); }
  .tv .lbl { font-size: 2.6vh; color: var(--muted); margin: 0; }
  .tv .code { font-size: 11vh; font-weight: 800; letter-spacing: .12em; line-height: 1; font-variant-numeric: tabular-nums; }
  .tv .qr { background: #fff; padding: 1.2vh; border-radius: 1vh; width: 30vh; height: 30vh; box-sizing: border-box; }
  .tv .qr svg { width: 100%; height: 100%; display: block; }
  .tv .url { font-size: 2.4vh; color: var(--muted); word-break: break-all; margin: 0; }
  .tv .status { font-size: 3vh; font-weight: 700; margin: 0; }
  .tv .right { flex: 1; display: flex; flex-direction: column; gap: 2vh; min-width: 0; }
  .tv .last { font-size: 9vh; font-weight: 800; line-height: 1; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .8vh 3vw; }
  .stats div { font-size: 3.4vh; border-bottom: 1px solid #2a2a2a; padding-bottom: .5vh; }
  .stats span { color: var(--muted); font-size: 2.8vh; margin-right: 1vw; }
  .stats b { font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.4vh; flex: 1; min-height: 0; }
  .grid div { background: var(--tile); border-radius: 1.2vh; display: flex; align-items: center; justify-content: center; font-size: 4vh; font-weight: 700; color: var(--muted); transition: transform .12s ease, background-color .12s ease; }
  .grid div.on { background: var(--accent); color: #000; transform: scale(1.05); }
  .grid div.hit { background: var(--ok); color: #000; }
  .tv .feed { font-family: ui-monospace, monospace; font-size: 2.4vh; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }

  /* ---------- Celular ---------- */
  .ph { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; gap: 16px;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .ph header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ph h1 { margin: 0; font-size: 20px; color: var(--accent); }
  .ph .st { font-size: 15px; font-weight: 700; text-align: right; }
  .ph .meta { font-size: 14px; color: var(--muted); margin: 0; }
  .pad { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; max-height: 70vh; aspect-ratio: 1 / 1; width: 100%; max-width: 420px; margin: 0 auto; }
  .ph button { -webkit-appearance: none; appearance: none; border: 0; border-radius: 18px; background: var(--tile); color: var(--fg); font: inherit; font-size: 34px; font-weight: 700; touch-action: manipulation; }
  .ph button:active, .ph button.down { background: var(--accent); color: #000; }
  .pad .ok-btn { border-radius: 50%; background: #333; font-size: 26px; }
  .extra { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 420px; margin: 0 auto; }
  .extra button { height: 72px; font-size: 20px; }
  .join { display: flex; flex-direction: column; gap: 12px; margin: auto 0; }
  .join input { font: inherit; font-size: 32px; letter-spacing: .2em; text-transform: uppercase; text-align: center; padding: 12px; border-radius: 12px; border: 2px solid #333; background: #1c1c1c; color: var(--fg); }
  .join button { height: 64px; font-size: 22px; background: var(--accent); color: #000; }
  .ph a { color: var(--accent); font-size: 14px; }
</style>

<!-- TV -->
<main class="tv" id="tv" hidden>
  <section class="left">
    <h1>Controle pelo celular</h1>
    <p class="lbl">Leia o QR no Chrome do celular ou digite o código em <b>…/tv/g</b></p>
    <div class="code" id="tvCode">—</div>
    <div class="qr" id="qr"></div>
    <p class="url" id="tvUrl"></p>
    <p class="status warn" id="tvStatus">Conectando…</p>
  </section>
  <section class="right">
    <div class="last" id="tvLast">Aguardando…</div>
    <div class="stats">
      <div><span>Comandos</span><b id="sCount">0</b></div>
      <div><span>Ida e volta</span><b id="sRtt">—</b></div>
      <div><span>Broker</span><b id="sBroker">—</b></div>
      <div><span>Reconexões</span><b id="sRe">0</b></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="feed" id="tvFeed">—</p>
  </section>
</main>

<!-- Celular: entrar com código -->
<main class="ph" id="join" hidden>
  <header><h1>Controle Read on TV</h1></header>
  <form class="join" id="joinForm">
    <p class="meta">Digite o código que aparece na TV</p>
    <input id="joinCode" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
    <button type="submit">Conectar</button>
    <a href="?tv=1">Usar esta tela como TV</a>
  </form>
</main>

<!-- Celular: d-pad -->
<main class="ph" id="ph" hidden>
  <header>
    <h1>Controle <span id="phCode"></span></h1>
    <div class="st warn" id="phStatus">Conectando…</div>
  </header>
  <p class="meta" id="phMeta">Ida e volta: —</p>
  <div class="pad">
    <span></span><button data-k="up" aria-label="Cima">▲</button><span></span>
    <button data-k="left" aria-label="Esquerda">◀</button><button class="ok-btn" data-k="ok">OK</button><button data-k="right" aria-label="Direita">▶</button>
    <span></span><button data-k="down" aria-label="Baixo">▼</button><span></span>
  </div>
  <div class="extra">
    <button data-k="back">↩ Voltar</button>
    <button data-k="play">⏯ Play/Pausa</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function () {
  /* Brokers MQTT públicos (WebSocket seguro). A TV escolhe um e o índice vai no link do celular (&b=). */
  var BROKERS = [
    { name: 'EMQX', url: 'wss://broker.emqx.io:8084/mqtt' },
    { name: 'HiveMQ', url: 'wss://broker.hivemq.com:8884/mqtt' }
  ];
  var PREFIX = 'readontv-g/';
  var ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var LABEL = { up: '▲ Cima', down: '▼ Baixo', left: '◀ Esquerda', right: '▶ Direita', ok: 'OK', back: '↩ Voltar', play: '⏯ Play/Pausa' };

  var qs = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (p) {
    if (!p) return;
    var i = p.indexOf('=');
    qs[decodeURIComponent(i < 0 ? p : p.slice(0, i))] = i < 0 ? '' : decodeURIComponent(p.slice(i + 1));
  });
  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (err) { return null; } }
  function newCode() { var s = ''; for (var i = 0; i < 5; i++) s += ALPHA[Math.floor(Math.random() * ALPHA.length)]; return s; }
  function clean(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); }
  function clientId(role) { return 'rotv-' + role + '-' + Math.random().toString(36).slice(2, 10); }
  function hhmmss() { var d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return ('0' + n).slice(-2); }).join(':'); }

  var code = clean(qs.c);
  if (typeof mqtt === 'undefined') {
    document.body.innerHTML = '<p style="font-size:4vh;padding:4vh;color:#FF8A80">Não foi possível carregar a biblioteca MQTT (CDN bloqueado?).</p>';
    return;
  }
  if (code.length === 5) startPhone();
  else if (!('tv' in qs) && Math.min(window.innerWidth, screen.width) < 700) startJoin();
  else startTv();

  /* ================= TV ================= */
  function startTv() {
    $('tv').hidden = false;
    var code = clean(store('g-code')) ;
    if (code.length !== 5) { code = newCode(); store('g-code', code); }
    var bi = 0, client = null, count = 0, reconnects = 0, connected = false, failTimer = null;
    var base = location.href.split('?')[0].split('#')[0];
    var cols = 4, cells = [], pos = 0, playing = false;

    var gridEl = $('grid');
    for (var i = 0; i < 12; i++) { var d = document.createElement('div'); d.textContent = i + 1; gridEl.appendChild(d); cells.push(d); }
    cells[0].classList.add('on');

    $('tvCode').textContent = code;
    function status(text, cls) { var el = $('tvStatus'); el.textContent = text; el.className = 'status ' + cls; }

    function renderLink() {
      var url = base + '?c=' + code + '&b=' + bi;
      $('tvUrl').textContent = url.replace(/^https?:\/\//, '');
      $('sBroker').textContent = BROKERS[bi].name;
      try {
        var q = qrcode(0, 'M'); q.addData(url); q.make();
        $('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      } catch (err) { $('qr').textContent = 'QR indisponível'; }
    }

    function connect() {
      if (client) { try { client.end(true); } catch (err) {} }
      connected = false;
      renderLink();
      status('Conectando ao ' + BROKERS[bi].name + '…', 'warn');
      client = mqtt.connect(BROKERS[bi].url, { clientId: clientId('tv'), clean: true, connectTimeout: 8000, reconnectPeriod: 2000, keepalive: 30, timerVariant: 'native' });
      clearTimeout(failTimer);
      /* Se o broker não responder em 10 s, tenta o próximo e atualiza o QR */
      failTimer = setTimeout(function () { if (!connected) { bi = (bi + 1) % BROKERS.length; connect(); } }, 10000);
      client.on('connect', function () {
        connected = true; clearTimeout(failTimer);
        client.subscribe(PREFIX + code + '/cmd', { qos: 0 });
        status('Pronto · ' + BROKERS[bi].name, 'ok');
      });
      client.on('reconnect', function () { reconnects++; $('sRe').textContent = reconnects; status('Reconectando…', 'warn'); });
      client.on('offline', function () { status('Sem conexão com o broker', 'bad'); });
      client.on('error', function (e) { status('Erro: ' + (e && e.message || e), 'bad'); });
      client.on('message', function (topic, payload) {
        var m; try { m = JSON.parse(String(payload)); } catch (err) { return; }
        if (!m || !LABEL[m.k]) return;
        client.publish(PREFIX + code + '/ack', JSON.stringify({ n: m.n }), { qos: 0 });
        apply(m);
      });
    }

    function apply(m) {
      count++;
      $('sCount').textContent = count;
      if (typeof m.r === 'number') $('sRtt').textContent = m.r + ' ms';
      $('tvLast').textContent = LABEL[m.k];
      $('tvFeed').textContent = hhmmss() + '  ' + m.k + '  #' + m.n;
      cells[pos].classList.remove('on', 'hit');
      var r = Math.floor(pos / cols), c = pos % cols, rows = cells.length / cols;
      if (m.k === 'up') r = Math.max(0, r - 1);
      else if (m.k === 'down') r = Math.min(rows - 1, r + 1);
      else if (m.k === 'left') c = Math.max(0, c - 1);
      else if (m.k === 'right') c = Math.min(cols - 1, c + 1);
      else if (m.k === 'back') { r = 0; c = 0; }
      else if (m.k === 'play') { playing = !playing; $('tvLast').textContent = playing ? '▶ Play' : '⏸ Pausa'; }
      pos = r * cols + c;
      cells[pos].classList.add('on');
      if (m.k === 'ok') { var el = cells[pos]; el.classList.add('hit'); setTimeout(function () { el.classList.remove('hit'); }, 250); }
    }

    connect();
  }

  /* ================= Celular: código ================= */
  function startJoin() {
    $('join').hidden = false;
    $('joinForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var c = clean($('joinCode').value);
      if (c.length === 5) location.href = location.pathname + '?c=' + c + '&b=' + (qs.b || 0);
    });
    $('joinCode').focus();
  }

  /* ================= Celular: d-pad ================= */
  function startPhone() {
    $('ph').hidden = false;
    $('phCode').textContent = code;
    var bi = Math.min(BROKERS.length - 1, Math.max(0, parseInt(qs.b, 10) || 0));
    var seq = 0, sent = {}, lastRtt = null, acked = false;
    function status(text, cls) { var el = $('phStatus'); el.textContent = text; el.className = 'st ' + cls; }

    var client = mqtt.connect(BROKERS[bi].url, { clientId: clientId('ph'), clean: true, connectTimeout: 8000, reconnectPeriod: 2000, keepalive: 30, timerVariant: 'native' });
    client.on('connect', function () {
      client.subscribe(PREFIX + code + '/ack', { qos: 0 });
      status(acked ? 'TV conectada' : 'Broker ok · toque para testar', acked ? 'ok' : 'warn');
    });
    client.on('reconnect', function () { status('Reconectando…', 'warn'); });
    client.on('offline', function () { status('Sem conexão', 'bad'); });
    client.on('error', function (e) { status('Erro: ' + (e && e.message || e), 'bad'); });
    client.on('message', function (topic, payload) {
      var m; try { m = JSON.parse(String(payload)); } catch (err) { return; }
      if (!m || !sent[m.n]) return;
      lastRtt = Math.round(performance.now() - sent[m.n]);
      delete sent[m.n];
      if (!acked) { acked = true; status('TV conectada', 'ok'); }
      $('phMeta').textContent = 'Ida e volta: ' + lastRtt + ' ms · ' + BROKERS[bi].name;
    });

    function send(k) {
      if (!client.connected) return;
      seq++;
      sent[seq] = performance.now();
      var msg = { k: k, n: seq };
      if (lastRtt !== null) msg.r = lastRtt;
      client.publish(PREFIX + code + '/cmd', JSON.stringify(msg), { qos: 0 });
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
      /* Descarta pendências antigas sem resposta */
      for (var n in sent) if (performance.now() - sent[n] > 5000) delete sent[n];
    }

    /* Toque dispara na hora (pointerdown); setas repetem enquanto o dedo fica pressionado */
    var holdT = null, repT = null;
    function stop(btn) { clearTimeout(holdT); clearInterval(repT); holdT = repT = null; if (btn) btn.classList.remove('down'); }
    Array.prototype.forEach.call(document.querySelectorAll('#ph button[data-k]'), function (btn) {
      var k = btn.getAttribute('data-k');
      btn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        stop();
        btn.classList.add('down');
        send(k);
        if (['up', 'down', 'left', 'right'].indexOf(k) !== -1) {
          holdT = setTimeout(function () { repT = setInterval(function () { send(k); }, 140); }, 450);
        }
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { btn.addEventListener(t, function () { stop(btn); }); });
      btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });
  }
})();
</script>
</html>
